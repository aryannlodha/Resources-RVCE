<!DOCTYPE html>
<html>
<head>
  <title>RVCE Layout</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .top-banner {
      background-color: yellow;
      border: 2px solid black;
      text-align: center;
      padding: 20px 0;
      font-weight: bold;
      font-size: 24px;
    }

    .second-banner {
      background-color: white;
      border: 2px solid black;
      text-align: center;
      padding: 20px 0;
      font-weight: bold;
      font-size: 20px;
    }

    .square-box {
      width: 250px;
      height: 250px;
      border: 2px solid black;
      padding: 10px;
      background-color: white;
      margin: 40px auto; /* center horizontally using margin */
    }

    .label {
      font-weight: bold;
      text-align: right;
    }

    .inner-box {
      border: 2px solid #000;
      margin-top: 30px;
      padding: 10px;
    }

    .divider {
      height: 3px;
      background-color: black;
      margin: 40px 0 10px; /* spacing above and below line */
    }

    .upper-text {
      font-family: 'Georgia', serif;
      font-size: 16px;
      text-align: right;
    }

    .lower-text {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    RV College of Engineering
  </div>

  <div class="second-banner">
    RVCE Contact
  </div>

  <div class="square-box">
    <div class="label">XYZ</div>
    <div class="inner-box">
      <div class="upper-text">Web Programming</div>
      <div class="divider"></div>
      <div class="lower-text">CIE</div>
    </div>
  </div>

</body>
</html>
