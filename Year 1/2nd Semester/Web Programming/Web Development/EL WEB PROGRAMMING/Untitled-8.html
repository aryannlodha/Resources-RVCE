<html>
    <head>
        <title>odd-even</title>
    </head>
    <body>
        <script>
            let num = prompt("enter till where u want: ");
            document.write("printing even nums", "<br>")
            for(let i = 0; i<=num; i++){
                if(i%2 == 0){
                    document.write(i, "<br>");
                }
            }
            document.write("printing odd nums", "<br>")
            for(let i = 1; i<=num; i++){
                if(i%2 != 0){
                    document.write(i, "<br>");
                }
            }
        </script>
    </body>
</html>
