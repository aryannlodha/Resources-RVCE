<html>
  <head>
    <title>USN Validation</title>
  </head>
  <body>
    <script>
      var usn = prompt("Enter Your USN");
      
      text_USN(usn);

      function text_USN(USN)
      {
        var check = USN.toLowerCase();
        var searching_USN = check.search(/^[r][v][c][e][0-9][0-9][b][a-z][a-z][0-9][0-9][0-9]$/);

        if (searching_USN == 0)
          alert(`${USN} is Valid`);
        else
          alert(`${USN} is invalid`);
      }
    </script>
  </body>
</html>
